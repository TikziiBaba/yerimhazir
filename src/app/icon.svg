<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="yerim-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="yerim-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#yerim-bg)" />
  
  <!-- Calendar Body -->
  <g transform="translate(12, 14)">
    <rect x="0" y="5" width="40" height="33" rx="7" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Top Bar line -->
    <path d="M0 14h40" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <!-- Binder rings -->
    <path d="M10 1v7M30 1v7" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <!-- Checkmark inside calendar (Hazır) -->
    <path d="M12 24l5 5 11-11" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Top Right Sparkle -->
  <path d="M52 6c0 3.5 3 6.5 6.5 6.5-3.5 0-6.5 3-6.5 6.5 0-3.5-3-6.5-6.5-6.5 3.5 0 6.5-3 6.5-6.5z" fill="url(#yerim-spark)" />
</svg>
